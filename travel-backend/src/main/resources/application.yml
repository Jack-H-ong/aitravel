server:
  port: 8080

spring:
  application:
    name: travel-backend
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: Aa112211
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai

# MyBatis-Plus
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# JWT (secret >= 256 bit; override via JWT_SECRET env var in production)
jwt:
  secret: ${JWT_SECRET:change-me-in-production-0123456789abcdef0123456789abcdef}
  expiration: 604800000

# AI gateway (Tongyi / DashScope). API Key 通过环境变量 QWEN_API_KEY（兼容 API_KEY）注入。
ai:
  api:
    provider: tongyi
    api-key: ${QWEN_API_KEY:${API_KEY:}}
    model: qwen-max
    base-url: https://dashscope.aliyuncs.com
    timeout: 30000
    temperature: 0.7
    max-tokens: 3000
